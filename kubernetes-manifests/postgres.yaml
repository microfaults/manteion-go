# Secret manteion-postgres is not committed. It is created once on the box by
# service-beds/scripts/lab-pg-secret.sh and holds four keys, read by the
# StatefulSet below and by the manteion Deployment. Only the password is
# generated; user and database are fixed:
#   POSTGRES_USER=manteion
#   POSTGRES_PASSWORD=<generated on the box>
#   POSTGRES_DB=manteion
#   DATABASE_URL=postgres://manteion:<password>@manteion-postgres:5432/manteion?sslmode=disable
---
# PostgreSQL StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: manteion-postgres
spec:
  serviceName: manteion-postgres
  replicas: 1
  selector:
    matchLabels:
      app: manteion-postgres
  template:
    metadata:
      labels:
        app: manteion-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: manteion-postgres
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
# PostgreSQL Service
apiVersion: v1
kind: Service
metadata:
  name: manteion-postgres
spec:
  selector:
    app: manteion-postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None  # Headless for StatefulSet
