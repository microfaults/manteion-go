apiVersion: apps/v1
kind: Deployment
metadata:
  name: manteion
  labels:
    app: manteion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: manteion
  template:
    metadata:
      labels:
        app: manteion
    spec:
      # fsGroup makes the cache volume group-writable for the image's
      # uid/gid-1000 runtime user (recordings must survive pod restarts —
      # the preload gate reads them across phases).
      securityContext:
        fsGroup: 1000
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: manteion-cache
      containers:
        - name: manteion
          image: manteion
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: cache
              mountPath: /var/cache/manteion
          env:
            - name: MANTEION_ADDR
              value: ":8080"
            - name: ZEUS_URL
              value: "https://2262-cse115b-02.be.ucsc.edu/zeus"
            - name: MANTEION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: manteion-postgres
                  key: DATABASE_URL
            # Binds workflow runs to a zeus dataset; without it zeus stages an
            # empty pool map and drives unresolved {{data.*}} traffic.
            - name: MANTEION_ZEUS_DATASET_ID
              value: "6ce88928f949a773"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              # Headroom over the 64 MiB cache-ingest body cap.
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: manteion
  labels:
    app: manteion
spec:
  type: ClusterIP
  selector:
    app: manteion
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: manteion-cache
  labels:
    app: manteion
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
