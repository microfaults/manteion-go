apiVersion: apps/v1
kind: Deployment
metadata:
  name: manteion
  labels:
    app: manteion
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: manteion
  template:
    metadata:
      labels:
        app: manteion
    spec:
      # fsGroup makes the cache volume group-writable for the image's
      # uid/gid-1000 runtime user (recordings must survive pod restarts —
      # the preload gate reads them across phases).
      securityContext:
        fsGroup: 1000
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: manteion-cache
      initContainers:
        - name: wait-postgres
          image: postgres:17-alpine
          command: ["sh", "-c", "until pg_isready -h manteion-postgres -p 5432 -t 2; do sleep 2; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: manteion
          image: manteion
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: cache
              mountPath: /var/cache/manteion
          env:
            - name: MANTEION_ADDR
              value: ":8080"
            - name: ZEUS_URL
              value: "http://zeus:8080"
            - name: PROMETHEUS_URL
              value: "http://prometheus:9090"
            - name: MANTEION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: manteion-postgres
                  key: DATABASE_URL
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              # Headroom over the 64 MiB cache-ingest body cap.
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: manteion
  labels:
    app: manteion
spec:
  type: ClusterIP
  selector:
    app: manteion
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: manteion-cache
  labels:
    app: manteion
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
