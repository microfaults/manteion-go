apiVersion: apps/v1
kind: Deployment
metadata:
  name: manteion
  labels:
    app: manteion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: manteion
  template:
    metadata:
      labels:
        app: manteion
    spec:
      containers:
        - name: manteion
          image: manteion
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: MANTEION_ADDR
              value: ":8080"
            - name: ZEUS_URL
              value: "http://archer:8080"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: manteion
  labels:
    app: manteion
spec:
  type: ClusterIP
  selector:
    app: manteion
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
