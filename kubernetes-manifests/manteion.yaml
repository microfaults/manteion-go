apiVersion: apps/v1
kind: Deployment
metadata:
  name: manteion
  labels:
    app: manteion
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: manteion
  template:
    metadata:
      labels:
        app: manteion
    spec:
      # fsGroup makes the cache volume group-writable for the image's
      # uid/gid-1000 runtime user (recordings must survive pod restarts —
      # the preload gate reads them across phases).
      securityContext:
        fsGroup: 1000
      # On SIGTERM the demo shuts down first (up to 15 s: the current run's
      # rule switched off, every event stream ended), then both listeners
      # get 10 s; the default 30 s grace period is too tight for both.
      terminationGracePeriodSeconds: 45
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: manteion-cache
      initContainers:
        - name: wait-postgres
          image: postgres:17-alpine
          command: ["sh", "-c", "until pg_isready -h manteion-postgres -p 5432 -t 2; do sleep 2; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: manteion
          image: manteion
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
            # The public demo's own listener (MANTEION_DEMO_ADDR): its six
            # routes only, none of the operator API.
            - containerPort: 8090
              name: demo
              protocol: TCP
          volumeMounts:
            - name: cache
              mountPath: /var/cache/manteion
          env:
            - name: MANTEION_ADDR
              value: ":8080"
            - name: ZEUS_URL
              value: "http://zeus:8080"
            - name: PROMETHEUS_URL
              value: "http://prometheus:9090"
            - name: MANTEION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: manteion-postgres
                  key: DATABASE_URL
            # The lab's zeus poll tick: a demo phase ends within 2 s of its
            # load (default 15 s).
            - name: MANTEION_POLL_INTERVAL
              value: "2s"
            - name: MANTEION_DEMO
              value: "true"
            - name: MANTEION_DEMO_ADDR
              value: ":8090"
            # Created on the box by service-beds' scripts/lab-demo-secret.sh
            # before the stack is applied; required. This Secret and demo mode
            # make the manifest deployable only through service-beds'
            # scripts/lab-up.sh: a skaffold deploy or a direct apply without
            # the Secret leaves the pod in CreateContainerConfigError.
            - name: MANTEION_DEMO_EDGE_SECRET
              valueFrom:
                secretKeyRef:
                  name: manteion-demo-edge
                  key: EDGE_SECRET
          # First boot runs the migrations before /healthz answers; liveness
          # waits until the startup probe passes (up to 2 s x 60 = 120 s).
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              # Headroom over the 64 MiB cache-ingest body cap.
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: manteion
  labels:
    app: manteion
spec:
  type: ClusterIP
  selector:
    app: manteion
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
    - port: 8090
      targetPort: 8090
      protocol: TCP
      name: demo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: manteion-cache
  labels:
    app: manteion
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
