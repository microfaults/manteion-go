components:
  schemas:
    api.ErrorResponse:
      properties:
        error:
          example: validation failed
          type: string
      type: object
    api.KillSwitchResult:
      properties:
        at:
          type: string
        disabled_rule_ids:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    api.SDKInstanceDetail:
      properties:
        active_rule_ids:
          description: "ActiveRuleIDs is every enabled rule targeting the instance's\
            \ service,\npriority order \u2014 the set the kill-switch disables. It\
            \ is broader than\nthe poll set: a rule attached to a pending phase is\
            \ listed here but is\nonly served once its phase runs (see RuleRepo.ForService)."
          items:
            type: string
          type: array
          uniqueItems: false
        address:
          type: string
        capabilities:
          description: 'Capabilities lists the fault categories the host executes

            (inline|network|resource|cachebox). Absent = all (the wire contract).'
          items:
            type: string
          type: array
          uniqueItems: false
        host:
          description: "Host names the instrument host that registered (\"in-process\"\
            \ | \"sidecar\");\nstored as host_kind \u2014 \"host\" already means fault\
            \ placement elsewhere."
          type: string
        id:
          type: string
        last_poll_at:
          type: string
        observed_at:
          type: string
        observed_errors:
          items:
            type: string
          type: array
          uniqueItems: false
        observed_etag:
          type: string
        observed_generation:
          description: 'Observed state (desired-state protocol v1): what the instance
            last told

            us it holds. ObservedGeneration comes from the poll''s version param and

            the status report; the rest only from POST /api/v1/sdk/status.'
          type: integer
        observed_unsupported:
          items:
            $ref: '#/components/schemas/model.UnsupportedRule'
          type: array
          uniqueItems: false
        poll_interval_ms:
          description: SDK's configured poll cadence
          type: integer
        recent_run_ids:
          description: 'RecentRunIDs is the ids of the most recent phases (up to 5,
            newest-

            started first) that froze this service or attached a rule targeting it.

            A "run" is a phase (see /api/v1/phases).'
          items:
            type: string
          type: array
          uniqueItems: false
        registered_at:
          type: string
        replay_set_id:
          type: string
        replay_set_state:
          description: fetching|committed|failed
          type: string
        routes:
          description: "Routes is the HTTP route inventory the service published at\n\
            registration. Optional \u2014 services may register without routes\n(e.g.\
            \ gRPC services). Aggregated across instances by the\nworkflow-builder\
            \ catalog handler."
          items:
            $ref: '#/components/schemas/model.SDKRoute'
          type: array
          uniqueItems: false
        service:
          type: string
        status:
          description: "\"alive\",\"stale\",\"dead\" \u2014 computed from poll staleness"
          type: string
        version:
          type: string
      type: object
    atropos.CacheBoxContext:
      properties:
        experiment_id:
          type: string
        key_headers:
          items:
            type: string
          type: array
          uniqueItems: false
        key_strategy:
          type: string
        miss_status:
          type: integer
        phase_id:
          type: string
        strategy_version:
          type: integer
      type: object
    atropos.CompiledCacheBox:
      properties:
        context:
          $ref: '#/components/schemas/atropos.CacheBoxContext'
        key_strategy:
          description: '"exact" | "exact_with_host" | "exact_with_body"'
          type: string
        mode:
          description: '"passthrough" | "replay" | "replay_with_delay"'
          type: string
      type: object
    atropos.CompiledComposition:
      properties:
        duration_ms:
          type: integer
        execution_mode:
          type: string
        members:
          items:
            $ref: '#/components/schemas/atropos.CompiledCompositionMember'
          type: array
          uniqueItems: false
        name:
          type: string
        ramp_down_ms:
          type: integer
        ramp_up_ms:
          type: integer
      type: object
    atropos.CompiledCompositionMember:
      properties:
        composition:
          $ref: '#/components/schemas/atropos.CompiledComposition'
        direction:
          type: string
        fault:
          $ref: '#/components/schemas/atropos.CompiledFault'
      type: object
    atropos.CompiledFault:
      properties:
        category:
          description: '"inline" (default), "network", "resource"'
          type: string
        duration_ms:
          type: integer
        fault_type:
          description: fault type within category
          type: string
        id:
          description: slot identity (service+category:type); unused on compiled rules
          type: string
        network:
          $ref: '#/components/schemas/atropos.NetworkEnvelope'
        params:
          items:
            type: integer
          type: array
          uniqueItems: false
        ramp_down_ms:
          type: integer
        ramp_up_ms:
          type: integer
      type: object
    atropos.CompiledRule:
      properties:
        cachebox:
          $ref: '#/components/schemas/atropos.CompiledCacheBox'
        composition:
          $ref: '#/components/schemas/atropos.CompiledComposition'
        fault:
          $ref: '#/components/schemas/atropos.CompiledFault'
        injection_point:
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        mode:
          type: string
        name:
          type: string
        priority:
          type: integer
        start_policy:
          type: string
      type: object
    atropos.DelayRequest:
      properties:
        context:
          $ref: '#/components/schemas/atropos.CacheBoxContext'
        mu:
          type: number
        seed:
          type: integer
        sigma:
          type: number
      type: object
    atropos.FaultRequest:
      properties:
        category:
          description: '"inline" (default), "network", "resource"'
          type: string
        duration_ms:
          type: integer
        fault_type:
          description: fault type within category
          type: string
        id:
          description: slot identity (service+category:type); unused on compiled rules
          type: string
        network:
          $ref: '#/components/schemas/atropos.NetworkEnvelope'
        params:
          items:
            type: integer
          type: array
          uniqueItems: false
        ramp_down_ms:
          type: integer
        ramp_up_ms:
          type: integer
      type: object
    atropos.NetworkEnvelope:
      properties:
        direction:
          description: "Direction selects which half of a proxied connection to apply\
            \ the\ntoxic to: \"upstream\" (client \u2192 server, request bytes) or\
            \ \"downstream\"\n(server \u2192 client, response bytes). It defaults\
            \ to \"upstream\" with\nHost==\"proxy\" and to \"downstream\" with Host==\"\
            inline\"."
          type: string
        host:
          description: "Host selects where the toxic runs.\n  \"proxy\"  \u2192 TCP\
            \ proxy (requires a NetworkResolver; the in-process default)\n  \"inline\"\
            \ \u2192 armed policy on the atroposd sidecar's proxied upstream calls\n\
            The in-process host has no proxied connection to shape: it skips a rule\n\
            with Host==\"inline\" (reported as unsupported) and rejects a single\n\
            /admin/fault slot with 400. An empty Host means \"inline\" on a host that\n\
            owns the proxied connections (the sidecar) and \"proxy\" in-process."
          type: string
        scope:
          description: 'Scope is the fraction of connections (proxy) or requests (inline)

            to which the toxic applies. Zero means 1.0 (all).'
          type: number
        target:
          description: 'Target is the logical name of the upstream service. Required
            for both

            hosts. With Host=="proxy" a NetworkResolver turns it into a

            (listen, upstream) address pair; with Host=="inline" it is the

            upstream''s host or host:port, matched against the outbound request''s

            host (a target without a port matches any port).'
          type: string
      type: object
    atropos.RegisterResponse:
      properties:
        active_faults:
          items:
            $ref: '#/components/schemas/atropos.FaultRequest'
          type: array
          uniqueItems: false
        etag:
          description: 'Etag is the ETag of this materialized document: a hash of
            its content

            alone, never the generation (that travels in Version and in the

            X-Atropos-Generation header), so an unchanged document keeps its ETag

            while the generation moves. The instance treats it as opaque and sends

            it back as `If-None-Match`.'
          type: string
        freeze_cfg:
          $ref: '#/components/schemas/atropos.DelayRequest'
        replay_set:
          $ref: '#/components/schemas/atropos.ReplaySetRef'
        rules:
          items:
            $ref: '#/components/schemas/atropos.CompiledRule'
          type: array
          uniqueItems: false
        status:
          type: string
        version:
          description: the generation, kept under the old name
          type: integer
      type: object
    atropos.ReplaySetRef:
      description: 'ReplaySet is the replay set desired on this instance: absent means
        no replay

        set is desired, so the instance clears one it holds. Present, it names the

        set to pull: ExperimentID and PhaseID are the (experiment, phase) pair it

        is installed under (the cache-box serves it only to the rule whose context

        matches that pair), ID is `sha256:<hex>` of the artifact bytes fetched from

        URL, and SHA256 is the W5 digest over its entries.'
      properties:
        count:
          type: integer
        experiment_id:
          type: string
        id:
          type: string
        key_strategy:
          type: string
        phase_id:
          type: string
        sha256:
          description: W5 digest over entries (cachebox.SetChecksum)
          type: string
        size_bytes:
          type: integer
        url:
          description: relative to the manteion base URL
          type: string
      type: object
    atropos.ReplaySetStatus:
      properties:
        id:
          type: string
        state:
          description: fetching | committed | failed
          type: string
      type: object
    atropos.RuleSync:
      properties:
        active_faults:
          items:
            $ref: '#/components/schemas/atropos.FaultRequest'
          type: array
          uniqueItems: false
        etag:
          description: 'Etag is the ETag of this materialized document: a hash of
            its content

            alone, never the generation (that travels in Version and in the

            X-Atropos-Generation header), so an unchanged document keeps its ETag

            while the generation moves. The instance treats it as opaque and sends

            it back as `If-None-Match`.'
          type: string
        freeze_cfg:
          $ref: '#/components/schemas/atropos.DelayRequest'
        replay_set:
          $ref: '#/components/schemas/atropos.ReplaySetRef'
        rules:
          items:
            $ref: '#/components/schemas/atropos.CompiledRule'
          type: array
          uniqueItems: false
        version:
          description: the generation, kept under the old name
          type: integer
      type: object
    atropos.StatusReport:
      properties:
        applied_generation:
          type: integer
        errors:
          items:
            type: string
          type: array
          uniqueItems: false
        etag:
          type: string
        instance_id:
          type: string
        replay_set:
          $ref: '#/components/schemas/atropos.ReplaySetStatus'
        service:
          type: string
        unsupported:
          items:
            $ref: '#/components/schemas/atropos.UnsupportedRule'
          type: array
          uniqueItems: false
      type: object
    atropos.UnsupportedRule:
      properties:
        category:
          type: string
        rule:
          type: string
      type: object
    model.CacheBoxRuleConfig:
      description: when type=cachebox
      properties:
        key_strategy:
          description: '"exact" | "exact_with_host" | "exact_with_body"'
          type: string
        mode:
          description: '"passthrough" | "replay" | "replay_with_delay"'
          type: string
      type: object
    model.Direction:
      description: '"upstream", "downstream", "" (non-network)'
      enum:
      - upstream
      - downstream
      - ''
      type: string
      x-enum-varnames:
      - DirectionUpstream
      - DirectionDownstream
      - DirectionNone
    model.ExecutionMode:
      description: '"parallel" or "sequential"'
      enum:
      - parallel
      - sequential
      type: string
      x-enum-varnames:
      - ExecutionParallel
      - ExecutionSequential
    model.FaultComposition:
      properties:
        created_at:
          type: string
        duration_ms:
          type: integer
        execution_mode:
          $ref: '#/components/schemas/model.ExecutionMode'
        id:
          type: string
        members:
          items:
            $ref: '#/components/schemas/model.FaultCompositionMember'
          type: array
          uniqueItems: false
        name:
          type: string
        ramp_down_ms:
          type: integer
        ramp_up_ms:
          type: integer
      type: object
    model.FaultCompositionMember:
      properties:
        child_composition_id:
          type: string
        direction:
          $ref: '#/components/schemas/model.Direction'
        fault_spec_id:
          type: string
      type: object
    model.FaultSpec:
      properties:
        category:
          description: '"inline", "network", "resource"'
          type: string
        created_at:
          type: string
        description:
          description: human-readable notes
          type: string
        duration_ms:
          type: integer
        fault_type:
          description: e.g. "error", "blackhole", "cpu"
          type: string
        host:
          type: string
        id:
          type: string
        name:
          type: string
        network:
          $ref: '#/components/schemas/model.NetworkEnvelope'
        params:
          description: type-specific parameters
          items:
            type: integer
          type: array
          uniqueItems: false
        ramp_down_ms:
          type: integer
        ramp_up_ms:
          type: integer
      type: object
    model.MatchCriteria:
      properties:
        injection_point:
          description: ingress/egress/transient/custom, "" = any
          type: string
        labels:
          additionalProperties:
            type: string
          description: AND semantics
          type: object
      type: object
    model.NetworkEnvelope:
      properties:
        direction:
          type: string
        scope:
          type: number
        target:
          type: string
      type: object
    model.Rule:
      properties:
        action:
          $ref: '#/components/schemas/model.RuleAction'
        created_at:
          type: string
        enabled:
          description: "Enabled gates serving on every channel (poll predicate AND\
            \ phase-start\npush). Deliberately zero-value FALSE: a create that omits\
            \ it yields a\ndisabled rule, which is what makes the create\u2192attach\u2192\
            enable experiment\nflow ordering-safe. Do not add default-true anywhere\
            \ in the create path."
          type: boolean
        id:
          type: string
        match:
          $ref: '#/components/schemas/model.MatchCriteria'
        mode:
          description: '"inline" or "background"'
          type: string
        name:
          type: string
        priority:
          type: integer
        service:
          type: string
        start_policy:
          description: '"deduplicate_by_rule" (default) | "always_start"'
          type: string
        updated_at:
          type: string
      type: object
    model.RuleAction:
      properties:
        cachebox:
          $ref: '#/components/schemas/model.CacheBoxRuleConfig'
        fault_composition_id:
          description: when type=fault_composition
          type: string
        fault_spec_id:
          description: when type=fault_spec
          type: string
        type:
          description: '"fault_spec" | "fault_composition" | "cachebox"'
          type: string
      type: object
    model.SDKInstance:
      properties:
        address:
          type: string
        capabilities:
          description: 'Capabilities lists the fault categories the host executes

            (inline|network|resource|cachebox). Absent = all (the wire contract).'
          items:
            type: string
          type: array
          uniqueItems: false
        host:
          description: "Host names the instrument host that registered (\"in-process\"\
            \ | \"sidecar\");\nstored as host_kind \u2014 \"host\" already means fault\
            \ placement elsewhere."
          type: string
        id:
          type: string
        last_poll_at:
          type: string
        observed_at:
          type: string
        observed_errors:
          items:
            type: string
          type: array
          uniqueItems: false
        observed_etag:
          type: string
        observed_generation:
          description: 'Observed state (desired-state protocol v1): what the instance
            last told

            us it holds. ObservedGeneration comes from the poll''s version param and

            the status report; the rest only from POST /api/v1/sdk/status.'
          type: integer
        observed_unsupported:
          items:
            $ref: '#/components/schemas/model.UnsupportedRule'
          type: array
          uniqueItems: false
        poll_interval_ms:
          description: SDK's configured poll cadence
          type: integer
        registered_at:
          type: string
        replay_set_id:
          type: string
        replay_set_state:
          description: fetching|committed|failed
          type: string
        routes:
          description: "Routes is the HTTP route inventory the service published at\n\
            registration. Optional \u2014 services may register without routes\n(e.g.\
            \ gRPC services). Aggregated across instances by the\nworkflow-builder\
            \ catalog handler."
          items:
            $ref: '#/components/schemas/model.SDKRoute'
          type: array
          uniqueItems: false
        service:
          type: string
        status:
          description: "\"alive\",\"stale\",\"dead\" \u2014 computed from poll staleness"
          type: string
        version:
          type: string
      type: object
    model.SDKRoute:
      properties:
        depends_on:
          items:
            type: string
          type: array
          uniqueItems: false
        description:
          type: string
        method:
          type: string
        path:
          type: string
      type: object
    model.UnsupportedRule:
      properties:
        category:
          type: string
        rule:
          type: string
      type: object
info:
  description: 'Central coordination controller for the atropos ecosystem.

    Manages rules, faults, experiments, workflows, and SDK lifecycle.'
  title: Manteion Control-Plane API
  version: '1.0'
openapi: 3.1.0
paths:
  /cache/artifacts/{id}:
    get:
      description: "Immutable NDJSON replay set (one CacheBoxWireEntry per line) named\
        \ by\nRuleSync.replay_set.id (\"sha256:<hex>\" of the file bytes). Supports\n\
        HEAD (Content-Length, ETag) and Range (206); the instance fetches it in\n\u2264\
        4 MiB ranges and commits when count and the W5 digest match."
      parameters:
      - description: artifact id (sha256:<hex>)
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: bytes=a-b; answered 206, or 416 past the end
        in: header
        name: Range
        schema:
          type: string
      - description: the artifact's ETag; a match answers 304
        in: header
        name: If-None-Match
        schema:
          type: string
      responses:
        '200':
          content:
            application/x-ndjson:
              schema:
                type: string
          description: the artifact; headers ETag, Content-Length
        '206':
          content:
            application/x-ndjson:
              schema:
                type: string
          description: the requested byte range; headers ETag, Content-Range
        '304':
          description: unchanged; the artifact is immutable
        '404':
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: 'unknown artifact (an id that is not sha256: and 64 lowercase
            hex digits is unknown too)'
        '416':
          description: range not satisfiable
        '500':
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: artifact lookup failed, or its file is unavailable
      summary: Fetch a replay-set artifact
      tags:
      - cache
  /faults/catalog:
    get:
      description: 'Lists every supported (category, fault_type) pair with its

        params field metadata (name/type/required/default) so

        clients can render fault forms without hardcoding the vocab.'
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: '{catalog: []faultcatalog.Entry}'
      summary: Fault catalogue
      tags:
      - faults
  /faults/compositions:
    get:
      description: Returns all fault compositions in creation order.
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/model.FaultComposition'
                type: array
          description: OK
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Internal Server Error
      summary: List fault compositions
      tags:
      - faults
    post:
      description: 'Persist a composition (parallel or sequential group of fault members).

        Validates depth (max 3), per-member directions, and pairwise fault

        incompatibilities against the current spec/composition repos.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/model.FaultComposition'
                description: Composition definition
                summary: composition
        description: Composition definition
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.FaultComposition'
          description: Created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: validation error (incl. depth or incompatibility)
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Internal Server Error
      summary: Create fault composition
      tags:
      - faults
  /faults/compositions/{id}:
    delete:
      parameters:
      - description: Fault composition ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: composition deleted
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: composition not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Internal Server Error
      summary: Delete fault composition
      tags:
      - faults
    get:
      parameters:
      - description: Fault composition ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.FaultComposition'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: composition not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Internal Server Error
      summary: Get fault composition
      tags:
      - faults
  /faults/specs:
    get:
      description: Returns all fault specs in creation order.
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/model.FaultSpec'
                type: array
          description: OK
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Internal Server Error
      summary: List fault specs
      tags:
      - faults
    post:
      description: "Persist an atomic fault definition. The body is validated per\n\
        model.FaultSpec.Validate() \u2014 category in {inline,network,resource},\n\
        fault_type matches the category, and config is non-empty."
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/model.FaultSpec'
                description: Fault spec definition
                summary: spec
        description: Fault spec definition
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.FaultSpec'
          description: Created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: validation error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Internal Server Error
      summary: Create fault spec
      tags:
      - faults
  /faults/specs/{id}:
    delete:
      parameters:
      - description: Fault spec ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: spec deleted
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: spec not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Internal Server Error
      summary: Delete fault spec
      tags:
      - faults
    get:
      parameters:
      - description: Fault spec ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.FaultSpec'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: spec not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Internal Server Error
      summary: Get fault spec
      tags:
      - faults
    put:
      description: 'Replace all mutable fields of an existing fault spec. The body

        is validated identically to creation; id is taken from the URL

        and created_at is preserved from the stored record.'
      parameters:
      - description: Fault spec ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/model.FaultSpec'
                description: Updated fault spec
                summary: spec
        description: Updated fault spec
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.FaultSpec'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: invalid JSON or validation error
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: spec not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Internal Server Error
      summary: Update fault spec
      tags:
      - faults
  /healthz:
    get:
      description: Returns 200 if the process is running. No dependency checks.
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: '{status: ok}'
      summary: Liveness probe
      tags:
      - health
  /readyz:
    get:
      description: Returns 200 once the database is reachable, 503 otherwise.
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: '{status: ok}'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: database unreachable
      summary: Readiness probe
      tags:
      - health
  /rules:
    get:
      description: Returns all configured rules, ordered by priority descending.
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/model.Rule'
                type: array
          description: OK
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: internal error
      summary: List rules
      tags:
      - rules
    post:
      description: "Persist a new rule. Action.Type discriminates between fault_spec,\n\
        fault_composition, and cachebox \u2014 exactly one payload must be set.\n\
        Rules are created DISABLED unless \"enabled\": true is explicit; for\nexperiment-attached\
        \ rules, create \u2192 attach \u2192 enable (in that order)\nis the leak-safe\
        \ lifecycle."
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/model.Rule'
                description: Rule definition
                summary: rule
        description: Rule definition
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Rule'
          description: Created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: validation error or infrastructure failure (currently collapsed;
            see openapi-conventions.md known gaps)
      summary: Create rule
      tags:
      - rules
  /rules/{id}:
    delete:
      parameters:
      - description: Rule ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: rule deleted
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: rule not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Internal Server Error
      summary: Delete rule
      tags:
      - rules
    get:
      parameters:
      - description: Rule ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Rule'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: rule not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Internal Server Error
      summary: Get rule
      tags:
      - rules
    put:
      description: Replace an existing rule. The id in the path overrides any id in
        the body.
      parameters:
      - description: Rule ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/model.Rule'
                description: Updated rule
                summary: rule
        description: Updated rule
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/model.Rule'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: invalid JSON or validation error
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: rule not found
      summary: Update rule
      tags:
      - rules
  /sdk/events:
    get:
      description: 'Server-sent events for one service. Event type rules_changed,
        with data

        {"generation":G}, is emitted on every change of the service''s generation:

        rule CRUD, fault-config fire/cancel/delete/expiry, kill switch, a capability

        change on re-register, and orchestrator phase transitions (enter, pause,

        drain, finish). A ": heartbeat" comment follows every 30 s. A nudge only:

        the long-poll (GET /sdk/rules) is primary; an SDK polls at once on

        rules_changed. The stream ends when the server shuts down.'
      parameters:
      - description: service name
        in: query
        name: service
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
          description: 'event stream: rules_changed events and heartbeat comments'
        '400':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: service query param required
        '500':
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: streaming not supported
      summary: Rule-change nudges (SSE)
      tags:
      - sdk
  /sdk/init:
    get:
      description: 'Returns 200 with status="ready" when manteion is ready to

        serve rules. Used by atropos-go SDKs as a startup gate.'
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: '{status: ready}'
      summary: SDK init readiness
      tags:
      - sdk
  /sdk/instances:
    get:
      description: 'Returns all currently registered SDK instances, including host,

        capabilities and observed state (observed_generation, observed_etag,

        observed_unsupported, observed_errors, replay_set_id/state, observed_at).

        Status is computed (alive/stale/dead) from last-poll-at.'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/model.SDKInstance'
                type: array
          description: OK
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Internal Server Error
      summary: List SDK instances
      tags:
      - sdk
  /sdk/instances/{id}:
    get:
      description: "Returns the instance's list row (status computed alive/stale/dead\n\
        from last-poll-at) plus active_rule_ids \u2014 every enabled rule\ntargeting\
        \ the instance's service, the set the kill-switch disables \u2014\nand recent_run_ids\
        \ \u2014 the most recent phases (up to 5, newest first)\nthat froze the service\
        \ or attached a rule targeting it."
      parameters:
      - description: Instance ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.SDKInstanceDetail'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: instance not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Internal Server Error
      summary: Get SDK instance
      tags:
      - sdk
  /sdk/instances/{id}/kill-switch:
    post:
      description: "Disables every currently-enabled rule whose service matches the\n\
        instance's service, through the same full rule update as\nPUT /rules/{id}\
        \ \u2014 the rule version and the service generation bump\nonce per rule,\
        \ so polling SDKs converge on their next poll (held polls\nwake and SSE subscribers\
        \ are nudged too).\nIdempotent: a repeat call reports an empty disabled_rule_ids."
      parameters:
      - description: Instance ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.KillSwitchResult'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: instance not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: "lookup failed, or some rules could not be disabled \u2014\
            \ retry; rules already disabled stay disabled"
      summary: Kill-switch an SDK instance's rules
      tags:
      - sdk
  /sdk/register:
    post:
      description: "Registers an atropos-go SDK process (in-process embed or atroposd\
        \ sidecar)\nwith its host kind and fault capabilities. The 201 response carries\n\
        status=\"registered\" plus the instance's materialized desired state \u2014\
        \nthe same RuleSync shape a 200 poll serves (version = generation, etag,\n\
        rules, active_faults, freeze_cfg, replay_set), already filtered by the\nadvertised\
        \ capabilities \u2014 so the SDK converges before its first poll.\nRegistering\
        \ with capabilities different from the stored ones bumps the\nservice generation.\
        \ If the desired state cannot be materialized the\nregistration still succeeds\
        \ with no document (version 0, empty etag,\nrules and active_faults null),\
        \ which the SDK applies as nothing."
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/model.SDKInstance'
                description: SDK instance metadata (id, service, address, poll_interval_ms,
                  routes, host, capabilities)
                summary: instance
        description: SDK instance metadata (id, service, address, poll_interval_ms,
          routes, host, capabilities)
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atropos.RegisterResponse'
          description: Created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: invalid JSON or registration error
      summary: Register SDK instance
      tags:
      - sdk
  /sdk/register/{id}:
    delete:
      parameters:
      - description: Instance ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: instance deregistered
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: instance not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Internal Server Error
      summary: Deregister SDK instance
      tags:
      - sdk
  /sdk/rules:
    get:
      description: "Records the instance's observed generation (version) and poll\
        \ time,\nmaterializes DesiredState(service, instance) and compares its ETag\
        \ (the\ncontent hash alone; the generation is not part of it) with If-None-Match.\n\
        With wait>0 (seconds, max 60) the request is held only when version is\nthe\
        \ current generation and the ETag matches, until the service's\ngeneration\
        \ changes, wait elapses or the server begins shutting down, then\nre-materialized.\
        \ A matching ETag with any other version (older, zero or\nabsent, or newer\
        \ after a database reset) is answered 304 at once with\nthe current X-Atropos-Generation\
        \ and ETag. 200 carries the RuleSync body\n(version = generation, etag, rules,\
        \ active_faults, freeze_cfg,\nreplay_set) with ETag and X-Atropos-Generation\
        \ headers; 304 carries the\nsame headers and no body \u2014 the instance adopts\
        \ X-Atropos-Generation\nwithout re-applying. An instance_id manteion does\
        \ not know (deregistered,\npurged, or a database reset) is answered 404, on\
        \ which the SDK registers\nagain; a poll without instance_id is served the\
        \ unfiltered document."
      parameters:
      - description: service name
        in: query
        name: service
        required: true
        schema:
          type: string
      - description: 'SDK instance ID; selects the capability filter and records observed
          state (unknown: 404)'
        in: query
        name: instance_id
        schema:
          type: string
      - description: generation the instance currently holds, recorded as observed_generation;
          absent, unparseable or above 9223372036854775807 reads as 0
        in: query
        name: version
        schema:
          type: integer
      - description: long-poll hold in seconds (0-60, default 0)
        in: query
        name: wait
        schema:
          type: integer
      - description: ETag of the last document the instance applied or confirmed
        in: header
        name: If-None-Match
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/atropos.RuleSync'
          description: desired state; headers ETag, X-Atropos-Generation
        '304':
          description: unchanged; headers ETag, X-Atropos-Generation
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: service query parameter required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: 'unknown instance_id: the instance registers again'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: desired state could not be materialized
      summary: Poll for desired state (long-poll)
      tags:
      - sdk
  /sdk/status:
    post:
      description: 'Sent by an SDK instance after every apply and whenever its replay-set

        state changes (fetching|committed|failed). The report is a full snapshot

        of what the instance holds and replaces the previous one: it stores

        etag, unsupported rules and errors (empty lists clear) and the replay-set

        id and state (an absent replay_set means the instance holds none and

        clears them) on the instance row, and raises observed_generation to

        applied_generation, never lowering it (the poll records the version the

        instance holds and is its authoritative writer). GET /sdk/instances

        exposes them and the orchestrator''s convergence barrier reads them.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/atropos.StatusReport'
                description: applied-state report
                summary: report
        description: applied-state report
        required: true
      responses:
        '204':
          description: stored
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: invalid JSON, missing instance_id or service, applied_generation
            above 9223372036854775807, or unknown replay_set.state
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: unknown instance
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Internal Server Error
      summary: Report applied desired state
      tags:
      - sdk
  /status:
    get:
      description: 'Returns a summary of internal counters and downstream reachability:

        rules (int), instances (int), zeus_reachable (bool).'
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: '{rules, instances, zeus_reachable}'
      summary: Manteion status overview
      tags:
      - health
servers:
- description: Local dev (HTTP)
  url: http://localhost:9090/api/v1
- description: Local dev (HTTPS)
  url: https://localhost:9090/api/v1
