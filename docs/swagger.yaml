    model.SDKInstance:
      properties:
        address:
          type: string
        applied_generation:
          description: 'AppliedGeneration is the generation the last stored status
            report was

            applied at, written with its replay-set state from the same report: it

            says which generation that state belongs to (the convergence barrier

            counts a frozen service''s replay set only when it is at the target).'
          type: integer
        capabilities:
          description: 'Capabilities lists the fault categories the host executes

            (inline|network|resource|cachebox). Absent = all (the wire contract).'
          items:
            type: string
          type: array
          uniqueItems: false
        host:
          description: "Host names the instrument host that registered (\"in-process\"\
            \ | \"sidecar\");\nstored as host_kind \u2014 \"host\" already means fault\
            \ placement elsewhere."
          type: string
        id:
          type: string
        last_poll_at:
          type: string
        observed_at:
          type: string
        observed_errors:
          items:
            type: string
          type: array
          uniqueItems: false
        observed_etag:
          type: string
        observed_generation:
          description: 'Observed state (desired-state protocol v1): what the instance
            last told

            us it holds. ObservedGeneration comes from the poll''s version param and

            the status report; the rest only from POST /api/v1/sdk/status.'
          type: integer
        observed_unsupported:
          items:
            $ref: '#/components/schemas/model.UnsupportedRule'
          type: array
          uniqueItems: false
        poll_interval_ms:
          description: SDK's configured poll cadence
          type: integer
        registered_at:
          type: string
        replay_set_id:
          type: string
        replay_set_state:
          description: fetching|committed|failed
          type: string
        routes:
          description: "Routes is the HTTP route inventory the service published at\n\
            registration. Optional \u2014 services may register without routes\n(e.g.\
            \ gRPC services). Aggregated across instances by the\nworkflow-builder\
            \ catalog handler."
          items:
            $ref: '#/components/schemas/model.SDKRoute'
          type: array
          uniqueItems: false
        service:
          type: string
        status:
          description: "\"alive\",\"stale\",\"dead\" \u2014 computed from poll staleness"
          type: string
        version:
          type: string
      type: object
    model.SDKRoute:
      properties:
        depends_on:
          items:
            type: string
          type: array
          uniqueItems: false
        description:
          type: string
        method:
          type: string
        path:
          type: string
      type: object
    model.UnsupportedRule:
      properties:
        category:
          type: string
        rule:
          type: string
      type: object
    opaharness.Evaluation:
      properties:
        applied:
          type: boolean
        changed:
          type: boolean
        decision_error:
          description: DecisionError is set when recording the decision failed.
          type: string
        error:
          type: string
        evaluated_at:
          type: string
        input_digest:
          type: string
        inputs:
          additionalProperties: {}
          type: object
        mutations:
          items:
            $ref: '#/components/schemas/opaharness.Mutation'
          type: array
          uniqueItems: false
        policy_id:
          type: string
        results:
          items:
            $ref: '#/components/schemas/opaharness.MutationResult'
          type: array
          uniqueItems: false
      type: object
    opaharness.Mutation:
      properties:
        enabled:
          type: boolean
        name:
          type: string
        op:
          type: string
        params:
          items:
            type: integer
          type: array
          uniqueItems: false
        rule:
          $ref: '#/components/schemas/model.Rule'
        service:
          type: string
      type: object
    opaharness.MutationResult:
      properties:
        error:
          type: string
        name:
          type: string
        op:
          type: string
        outcome:
          type: string
        rule_id:
          type: string
        service:
          type: string
      type: object
info:
  description: 'Central coordination controller for the atropos ecosystem.

    Manages rules, faults, experiments, workflows, and SDK lifecycle.'
  title: Manteion Control-Plane API
  version: '1.0'
openapi: 3.1.0
paths:
  /cache/artifacts/{id}:
    get:
      description: "Immutable NDJSON replay set (one CacheBoxWireEntry per line) named\
        \ by\nRuleSync.replay_set.id (\"sha256:<hex>\" of the file bytes). Supports\n\
        HEAD (Content-Length, ETag) and Range (206); the instance fetches it in\n\u2264\
        4 MiB ranges and commits when count and the W5 digest match."
      parameters:
      - description: artifact id (sha256:<hex>)
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: bytes=a-b; answered 206, or 416 past the end
        in: header
        name: Range
        schema:
          type: string
      - description: the artifact's ETag; a match answers 304
        in: header
        name: If-None-Match
        schema:
          type: string
      responses:
        '200':
          content:
            application/x-ndjson:
              schema:
                type: string
          description: the artifact; headers ETag, Content-Length
        '206':
          content:
            application/x-ndjson:
              schema:
                type: string
          description: the requested byte range; headers ETag, Content-Range
        '304':
          description: unchanged; the artifact is immutable
        '404':
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: unknown artifact (an id that is not `sha256:` followed by 64
            lowercase hex digits is treated as unknown)
        '416':
          description: range not satisfiable
        '500':
          content:
            application/x-ndjson:
              schema:
