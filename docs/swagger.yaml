        phase_id)

        pair, accepted only while that pair names a phase that persists its cache

        and is running or draining. Deduped on (experiment, phase, instance, epoch,

        batch_seq): epoch is the instance''s start time in unix nanoseconds, so a

        restarted instance, starting batch_seq over at 1, never collides with its

        previous process''s batches; a retried batch answers duplicate=true and

        accepts nothing. A body without epoch is epoch 0.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/CacheIngestEnvelope'
                description: the batch
                summary: body
        description: the batch
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheIngestResult'
          description: entries accepted; duplicate for a retried batch
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: malformed JSON, or service, experiment_id or phase_id missing
        '404':
