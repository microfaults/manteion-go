components:
  schemas:
    CacheIngestEnvelope:
      properties:
        batch_seq:
          description: 1-based, monotonic within one epoch
          example: 1
          type: integer
        entries:
          items:
            $ref: '#/components/schemas/atropos.CacheBoxWireEntry'
          type: array
          uniqueItems: false
        epoch:
          description: the instance's start time, unix nanoseconds; absent = 0 (old
            clients)
          example: 1793836800000000000
          type: integer
        experiment_id:
          type: string
        instance:
          example: cartservice-7d9f-abcde
          type: string
        phase_id:
          type: string
        service:
          example: cartservice
          type: string
      type: object
    CacheIngestResult:
      properties:
        accepted:
          type: integer
        duplicate:
          type: boolean
      type: object
    api.ErrorResponse:
      properties:
        error:
          example: validation failed
          type: string
      type: object
    api.KillSwitchResult:
      properties:
        at:
          type: string
        cancelled_fault_config_ids:
          description: 'CancelledFaultConfigIDs is every active fault config for the
            service the

            call cancelled, oldest first.'
          items:
            type: string
          type: array
          uniqueItems: false
        disabled_rule_ids:
          description: DisabledRuleIDs is every rule the call disabled, priority order.
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    api.Page:
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
      type: object
    api.PageEnvelope-model_PolicyDecision:
      properties:
        data:
          items:
            $ref: '#/components/schemas/model.PolicyDecision'
          type: array
          uniqueItems: false
        page:
          $ref: '#/components/schemas/api.Page'
      type: object
    api.SDKInstanceDetail:
      properties:
        active_rule_ids:
          description: "ActiveRuleIDs is every enabled rule targeting the instance's\
            \ service,\npriority order \u2014 the set the kill-switch disables. It\
            \ is broader than\nthe poll set: a rule attached to a pending phase is\
            \ listed here but is\nonly served once its phase runs (see RuleRepo.ForService)."
          items:
            type: string
          type: array
          uniqueItems: false
        address:
          type: string
        applied_generation:
          description: 'AppliedGeneration is the generation the last stored status
            report was

            applied at, written with its replay-set state from the same report: it

            says which generation that state belongs to (the convergence barrier

            counts a frozen service''s replay set only when it is at the target).'
          type: integer
        capabilities:
          description: 'Capabilities lists the fault categories the host executes

            (inline|network|resource|cachebox). Absent = all (the wire contract).'
          items:
            type: string
          type: array
          uniqueItems: false
        host:
          description: "Host names the instrument host that registered (\"in-process\"\
            \ | \"sidecar\");\nstored as host_kind \u2014 \"host\" already means fault\
            \ placement elsewhere."
          type: string
        id:
          type: string
        last_poll_at:
          type: string
        observed_at:
          type: string
        observed_errors:
          items:
            type: string
          type: array
          uniqueItems: false
        observed_etag:
          type: string
        observed_generation:
          description: 'Observed state (desired-state protocol v1): what the instance
            last told

            us it holds. ObservedGeneration comes from the poll''s version param and

            the status report; the rest only from POST /api/v1/sdk/status.'
          type: integer
        observed_unsupported:
          items:
            $ref: '#/components/schemas/model.UnsupportedRule'
          type: array
          uniqueItems: false
        poll_interval_ms:
          description: SDK's configured poll cadence
          type: integer
        recent_run_ids:
          description: 'RecentRunIDs is the ids of the most recent phases (up to 5,
            newest-

            started first) that froze this service or attached a rule targeting it.

            A "run" is a phase (see /api/v1/phases).'
          items:
            type: string
          type: array
          uniqueItems: false
        registered_at:
          type: string
        replay_set_id:
          type: string
        replay_set_state:
          description: fetching|committed|failed
          type: string
        routes:
          description: "Routes is the HTTP route inventory the service published at\n\
            registration. Optional \u2014 services may register without routes\n(e.g.\
            \ gRPC services). Aggregated across instances by the\nworkflow-builder\
            \ catalog handler."
          items:
            $ref: '#/components/schemas/model.SDKRoute'
          type: array
          uniqueItems: false
        service:
          type: string
        status:
          description: "\"alive\",\"stale\",\"dead\" \u2014 computed from poll staleness"
          type: string
        version:
          type: string
      type: object
    atropos.CacheBoxContext:
      properties:
        experiment_id:
          type: string
        key_headers:
          items:
            type: string
          type: array
          uniqueItems: false
        key_strategy:
          type: string
        miss_status:
          type: integer
        phase_id:
          type: string
        strategy_version:
          type: integer
      type: object
    atropos.CacheBoxWireEntry:
      properties:
        body:
          items:
            type: integer
          type: array
          uniqueItems: false
        header:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
        key:
          type: string
        key_strategy:
          type: string
        observed_latency_us:
          type: integer
        recorded_at:
          type: string
        request_meta:
          $ref: '#/components/schemas/cachebox.RequestMeta'
        response_body_sha256:
          type: string
        status_code:
          type: integer
        strategy_version:
          type: integer
      type: object
    atropos.CompiledCacheBox:
      properties:
        context:
          $ref: '#/components/schemas/atropos.CacheBoxContext'
        key_strategy:
          description: '"exact" | "exact_with_host" | "exact_with_body"'
          type: string
        mode:
          description: '"passthrough" | "replay" | "replay_with_delay"'
          type: string
      type: object
    atropos.CompiledComposition:
      properties:
        duration_ms:
          type: integer
        execution_mode:
          type: string
        members:
          items:
            $ref: '#/components/schemas/atropos.CompiledCompositionMember'
          type: array
          uniqueItems: false
        name:
          type: string
        ramp_down_ms:
          type: integer
        ramp_up_ms:
          type: integer
      type: object
    atropos.CompiledCompositionMember:
      properties:
        composition:
          $ref: '#/components/schemas/atropos.CompiledComposition'
        direction:
          type: string
        fault:
          $ref: '#/components/schemas/atropos.CompiledFault'
      type: object
    atropos.CompiledFault:
      properties:
        category:
          description: '"inline" (default), "network", "resource"'
          type: string
        duration_ms:
          type: integer
        fault_type:
          description: fault type within category
          type: string
        id:
          description: slot identity (service+category:type); unused on compiled rules
          type: string
        network:
          $ref: '#/components/schemas/atropos.NetworkEnvelope'
        params:
          items:
            type: integer
          type: array
          uniqueItems: false
        ramp_down_ms:
          type: integer
        ramp_up_ms:
          type: integer
      type: object
    atropos.CompiledRule:
      properties:
        cachebox:
          $ref: '#/components/schemas/atropos.CompiledCacheBox'
        composition:
          $ref: '#/components/schemas/atropos.CompiledComposition'
        fault:
          $ref: '#/components/schemas/atropos.CompiledFault'
        injection_point:
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        mode:
          type: string
        name:
          type: string
        priority:
          type: integer
        start_policy:
          type: string
      type: object
    atropos.DelayRequest:
      properties:
        context:
          $ref: '#/components/schemas/atropos.CacheBoxContext'
        mu:
          type: number
        seed:
          type: integer
        sigma:
          type: number
      type: object
    atropos.FaultRequest:
      properties:
        category:
          description: '"inline" (default), "network", "resource"'
          type: string
        duration_ms:
          type: integer
        fault_type:
          description: fault type within category
          type: string
        id:
          description: slot identity (service+category:type); unused on compiled rules
          type: string
        network:
          $ref: '#/components/schemas/atropos.NetworkEnvelope'
        params:
          items:
            type: integer
          type: array
          uniqueItems: false
        ramp_down_ms:
          type: integer
        ramp_up_ms:
          type: integer
      type: object
    atropos.NetworkEnvelope:
      properties:
        direction:
          description: "Direction selects which half of a proxied connection to apply\
            \ the\ntoxic to: \"upstream\" (client \u2192 server, request bytes) or\
            \ \"downstream\"\n(server \u2192 client, response bytes). It defaults\
            \ to \"upstream\" with\nHost==\"proxy\" and to \"downstream\" with Host==\"\
            inline\"."
          type: string
        host:
          description: "Host selects where the toxic runs.\n  \"proxy\"  \u2192 TCP\
            \ proxy (requires a NetworkResolver; the in-process default)\n  \"inline\"\
            \ \u2192 armed policy on the atroposd sidecar's proxied upstream calls\n\
            The in-process host has no proxied connection to shape: it skips a rule\n\
            with Host==\"inline\" (reported as unsupported) and rejects a single\n\
            /admin/fault slot with 400. An empty Host means \"inline\" on a host that\n\
            owns the proxied connections (the sidecar) and \"proxy\" in-process."
          type: string
        scope:
          description: 'Scope is the fraction of connections (proxy) or requests (inline)

            to which the toxic applies. Zero means 1.0 (all).'
          type: number
        target:
          description: 'Target is the logical name of the upstream service. Required
            for both

            hosts. With Host=="proxy" a NetworkResolver turns it into a

            (listen, upstream) address pair; with Host=="inline" it is the

            upstream''s host or host:port, matched against the outbound request''s

            host (a target without a port matches any port).'
          type: string
      type: object
    atropos.RegisterResponse:
      properties:
        active_faults:
          items:
            $ref: '#/components/schemas/atropos.FaultRequest'
          type: array
          uniqueItems: false
        etag:
          description: 'Etag is the ETag of this materialized document: a hash of
            its content

            alone, never the generation (that travels in Version and in the

            X-Atropos-Generation header), so an unchanged document keeps its ETag

            while the generation moves. The instance treats it as opaque and sends

            it back as `If-None-Match`.'
          type: string
        freeze_cfg:
          $ref: '#/components/schemas/atropos.DelayRequest'
        replay_set:
          $ref: '#/components/schemas/atropos.ReplaySetRef'
        rules:
          items:
            $ref: '#/components/schemas/atropos.CompiledRule'
          type: array
          uniqueItems: false
        status:
          type: string
        version:
          description: the generation, kept under the old name
          type: integer
      type: object
    atropos.ReplaySetRef:
      description: 'ReplaySet is the replay set desired on this instance: absent means
        no replay

        set is desired, so the instance clears one it holds. Present, it names the

        set to pull: ExperimentID and PhaseID are the (experiment, phase) pair it

        is installed under (the cache-box serves it only to the rule whose context

        matches that pair), ID is `sha256:<hex>` of the artifact bytes fetched from

        URL, and SHA256 is the W5 digest over its entries.'
      properties:
        count:
          type: integer
        experiment_id:
          type: string
        id:
          type: string
        key_strategy:
          type: string
        phase_id:
          type: string
        sha256:
          description: W5 digest over entries (cachebox.SetChecksum)
          type: string
        size_bytes:
          type: integer
        url:
          description: relative to the manteion base URL
          type: string
      type: object
    atropos.ReplaySetStatus:
      properties:
        id:
          type: string
        state:
          description: fetching | committed | failed
          type: string
      type: object
    atropos.RuleSync:
      properties:
        active_faults:
          items:
            $ref: '#/components/schemas/atropos.FaultRequest'
          type: array
          uniqueItems: false
        etag:
          description: 'Etag is the ETag of this materialized document: a hash of
            its content

            alone, never the generation (that travels in Version and in the

            X-Atropos-Generation header), so an unchanged document keeps its ETag

            while the generation moves. The instance treats it as opaque and sends

            it back as `If-None-Match`.'
          type: string
        freeze_cfg:
          $ref: '#/components/schemas/atropos.DelayRequest'
        replay_set:
          $ref: '#/components/schemas/atropos.ReplaySetRef'
        rules:
          items:
            $ref: '#/components/schemas/atropos.CompiledRule'
          type: array
          uniqueItems: false
        version:
          description: the generation, kept under the old name
          type: integer
      type: object
    atropos.StatusReport:
      properties:
        applied_generation:
          type: integer
        errors:
          items:
            type: string
          type: array
          uniqueItems: false
        etag:
          type: string
        instance_id:
          type: string
        replay_set:
          $ref: '#/components/schemas/atropos.ReplaySetStatus'
        service:
          type: string
        unsupported:
          items:
            $ref: '#/components/schemas/atropos.UnsupportedRule'
          type: array
          uniqueItems: false
      type: object
    atropos.UnsupportedRule:
      properties:
        category:
          type: string
        rule:
          type: string
      type: object
    cachebox.RequestMeta:
      properties:
        host:
          type: string
        method:
          type: string
        path:
          type: string
      type: object
    model.CacheBoxRuleConfig:
      description: when type=cachebox
      properties:
        key_strategy:
          description: '"exact" | "exact_with_host" | "exact_with_body"'
          type: string
        mode:
          description: '"passthrough" | "replay" | "replay_with_delay"'
          type: string
      type: object
    model.Direction:
      description: '"upstream", "downstream", "" (non-network)'
      enum:
      - upstream
      - downstream
      - ''
      type: string
      x-enum-varnames:
      - DirectionUpstream
      - DirectionDownstream
      - DirectionNone
    model.ExecutionMode:
      description: '"parallel" or "sequential"'
      enum:
      - parallel
      - sequential
      type: string
      x-enum-varnames:
      - ExecutionParallel
      - ExecutionSequential
    model.FaultComposition:
      properties:
        created_at:
          type: string
        duration_ms:
          type: integer
        execution_mode:
          $ref: '#/components/schemas/model.ExecutionMode'
        id:
          type: string
        members:
          items:
            $ref: '#/components/schemas/model.FaultCompositionMember'
          type: array
          uniqueItems: false
        name:
          type: string
        ramp_down_ms:
          type: integer
        ramp_up_ms:
          type: integer
      type: object
    model.FaultCompositionMember:
      properties:
        child_composition_id:
          type: string
        direction:
          $ref: '#/components/schemas/model.Direction'
        fault_spec_id:
          type: string
      type: object
    model.FaultSpec:
      properties:
        category:
          description: '"inline", "network", "resource"'
          type: string
        created_at:
          type: string
        description:
          description: human-readable notes
          type: string
        duration_ms:
          type: integer
        fault_type:
          description: e.g. "error", "blackhole", "cpu"
          type: string
        host:
          type: string
        id:
          type: string
        name:
          type: string
        network:
          $ref: '#/components/schemas/model.NetworkEnvelope'
        params:
          description: type-specific parameters
          items:
            type: integer
          type: array
          uniqueItems: false
        ramp_down_ms:
          type: integer
        ramp_up_ms:
          type: integer
      type: object
    model.MatchCriteria:
      properties:
        injection_point:
          description: ingress/egress/transient/custom, "" = any
          type: string
        labels:
          additionalProperties:
            type: string
          description: AND semantics
          type: object
      type: object
    model.NetworkEnvelope:
      properties:
        direction:
          type: string
        scope:
          type: number
        target:
          type: string
      type: object
    model.OPAPolicy:
      properties:
        cooldown_s:
          type: integer
        created_at:
          type: string
        enabled:
          type: boolean
        id:
          type: string
        inputs:
          items:
            $ref: '#/components/schemas/model.PolicyInput'
          type: array
          uniqueItems: false
        interval_s:
          type: integer
        name:
          type: string
        rego:
          type: string
        scope:
          $ref: '#/components/schemas/model.PolicyScope'
        updated_at:
          type: string
      type: object
    model.PolicyDecision:
      properties:
        applied:
          type: boolean
        error:
          type: string
        evaluated_at:
          type: string
        id:
          type: string
        input_digest:
          type: string
        mutations:
          description: '[]opaharness.MutationResult {op, service, name, outcome, error?,
            rule_id?}; a dry run (applied=false) lists one outcome "dry_run" entry
            per in-scope would-be mutation'
          items:
            type: integer
          type: array
          uniqueItems: false
        policy_id:
          type: string
      type: object
    model.PolicyInput:
      properties:
        kind:
          type: string
        name:
          type: string
        query:
          type: string
        source:
          type: string
      type: object
    model.PolicyScope:
      properties:
        services:
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
    model.Rule:
      properties:
        action:
          $ref: '#/components/schemas/model.RuleAction'
        created_at:
          type: string
        enabled:
          description: "Enabled gates serving: only an enabled rule is served, through\
            \ the\ndesired-state document its service's instances poll (a phase-attached\n\
            one while its phase runs). Deliberately zero-value FALSE: a create that\n\
            omits it yields a disabled rule, which is what makes the\ncreate\u2192\
            attach\u2192enable experiment flow ordering-safe. Do not add\ndefault-true\
            \ anywhere in the create path."
          type: boolean
        id:
          type: string
        match:
          $ref: '#/components/schemas/model.MatchCriteria'
        mode:
          description: '"inline" or "background"'
          type: string
        name:
          type: string
        priority:
          type: integer
        service:
          type: string
        start_policy:
          description: '"deduplicate_by_rule" (default) | "always_start"'
