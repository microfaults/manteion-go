  /opa/policies/{id}/decisions:
    get:
      description: 'The policy''s decision log, newest first (evaluated_at, then id),
        in the

        standard {data, page} envelope. One decision per evaluation, dry runs

        included. Each decision''s mutations is an array of opaharness.MutationResult

        ({op, service, name, outcome, error?, rule_id?}): for an applied evaluation

        the scope refusals (outcome "refused") followed by the mutator''s results

        (created | updated | deleted | unchanged | failed); for a dry run

        (applied=false) the refusals followed by one outcome "dry_run" entry per

        in-scope would-be mutation. error is set when the evaluation failed.'
      parameters:
      - description: Policy ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Page size (default 20, max 200)
        in: query
        name: limit
        schema:
          type: integer
      - description: Page offset (default 0)
        in: query
        name: offset
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.PageEnvelope-model_PolicyDecision'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: policy not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: Internal Server Error
      summary: List OPA policy decisions
      tags:
      - autorules
  /opa/policies/{id}/evaluate:
    post:
      description: 'Evaluate the policy once against live telemetry, enabled or not.

        Defaults to a dry run: the mutations are computed and scope-checked but

        not applied, and results holds only the scope refusals. With

        apply=true the in-scope mutations are applied through the rule

        repository and results holds the refusals plus the mutator''s results;

        an applying evaluation that changed something starts the policy''s

        cooldown. Every evaluation is recorded in the decision log (see

        /opa/policies/{id}/decisions). Compile, input, eval and apply failures

        are reported in the Evaluation''s error with 200; a decision that could

        not be recorded is reported in decision_error, also with 200 (the

        results, an apply included, happened). MANTEION_POLICY_ENGINE gates only

        the harness loop, not this endpoint; 503 only when the server was built

        without a harness.'
      parameters:
      - description: Policy ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: 'apply the mutations (default false: dry run)'
        in: query
        name: apply
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/opaharness.Evaluation'
          description: OK
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: policy not found
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/api.ErrorResponse'
          description: opa harness unavailable (server built without one)
      summary: Evaluate OPA policy
      tags:
      - autorules
