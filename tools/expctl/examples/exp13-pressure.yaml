# EXP-13 — resource-pressure matrix on nodes not yet pressured.
# exp2/exp4 pressured catalog (cpu), rec (memory), currency (io). This run covers the
# remaining interesting cells: cpu on currency (highest-QPS leaf — every price
# localization), memory-thrash on catalog (the shared leaf: does mem pressure there
# amplify through fan-in the way its latency fault did?), cpu on payment (buyer-path
# leaf). No freezes, no recording — fast phases; the final plain phase is the
# recovery check (latency and RSS must return to the first plain phase's level;
# gate G6 boundary assertion).

fault_specs:
  - name: exp13-cpu-spike
    category: resource
    fault_type: cpu
    params: { target_load: 0.5 }
    duration_ms: 150000
  - name: exp13-mem-pressure
    category: resource
    fault_type: memory
    params: { target_load: 0.5, thrashing: true }
    duration_ms: 150000

rules:
  - name: exp13-cpu-currency
    service: currencyservice
    fault_spec: exp13-cpu-spike
    mode: background
  - name: exp13-mem-catalog
    service: productcatalogservice
    fault_spec: exp13-mem-pressure
    mode: background
  - name: exp13-cpu-payment
    service: paymentservice
    fault_spec: exp13-cpu-spike
    mode: background

workflows:
  - name: browse-nodeport
    file: zeus-go/k6/flows/online-boutique/browse.json
    base_url: http://2262-cse115b-01.be.ucsc.edu:31785
    think_scale: 0.25
  - name: buyer-nodeport
    file: zeus-go/k6/flows/online-boutique/checkout-buyer.json
    base_url: http://2262-cse115b-01.be.ucsc.edu:31785
    think_scale: 0.25

experiment:
  name: exp13-pressure
  hypothesis: >
    CPU pressure on currency degrades both flows (it sits on browse and buyer paths);
    memory-thrash on catalog amplifies through the same fan-in that amplified its
    latency fault; CPU pressure on payment reaches only buyers. The closing plain
    phase returns to the opening plain phase's levels (no sticky residue).
  phases:
    - name: p0-plain
      workflows: &load
        - { workflow: buyer-nodeport,  rate_rps: 3, vus: 50, duration_sec: 120 }
        - { workflow: browse-nodeport, rate_rps: 1, vus: 10, duration_sec: 120 }
    - name: p1-cpu-currency
      rules: [exp13-cpu-currency]
      workflows: *load
    - name: p2-mem-catalog
      rules: [exp13-mem-catalog]
      workflows: *load
    - name: p3-cpu-payment
      rules: [exp13-cpu-payment]
      workflows: *load
    - name: p4-plain-recovery
      workflows: *load
