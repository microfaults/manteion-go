version: "3.9"
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: manteion
      POSTGRES_PASSWORD: manteion
      POSTGRES_DB: manteion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manteion"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
