# ---------------------------------------------------------------------------
# manteion-go GitLab CI/CD Pipeline
#
# Stages:
#   check  — Go build/vet/test, OpenAPI freshness, race detection
#   review — AI code review (schedule/manual/trigger only)
#
# Dependency: manteion-go has a local replace directive for atropos-go.
# All Go jobs clone the sibling repo via CI_JOB_TOKEN before building.
# Branch policy: always atropos-go 'develop' (stable integration branch).
#
# Required CI/CD variables (Settings > CI/CD > Variables, masked):
#   ANTHROPIC_API_KEY — Anthropic API key          [if LLM_PROVIDER=claude]
#   GOOGLE_API_KEY    — Google AI API key          [if LLM_PROVIDER=gemini]
#
# Optional:
#   GITLAB_API_TOKEN  — Project access token (api scope); enables commit comments
#   LLM_PROVIDER      — "claude" (default) or "gemini"
#   LLM_MODEL         — Override model ID (e.g. "claude-opus-4-6")
#   REVIEW_PROMPT     — Extra review instructions appended to the system prompt
#   FROM_COMMIT       — Base commit ref (manual mode; omit for scheduled lookback)
#   TO_COMMIT         — Head commit ref (default: HEAD)
#   REVIEW_HOURS      — Hours to look back in scheduled mode (default: 24)
#   MAX_DIFF_CHARS    — Max diff characters sent to the LLM (default: 120000)
# ---------------------------------------------------------------------------

variables:
  LLM_PROVIDER: "claude"
  LLM_MODEL: ""
  REVIEW_PROMPT: ""
  FROM_COMMIT: ""
  TO_COMMIT: "HEAD"
  REVIEW_HOURS: "24"
  MAX_DIFF_CHARS: "120000"

stages:
  - check
  - review

# ---------------------------------------------------------------------------
# Go verification
# ---------------------------------------------------------------------------

# Shared template for Go jobs that need atropos-go.
.go-base:
  image: golang:1.25
  before_script:
    - git clone --depth 1 --branch develop
        https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/microfaults/atropos-go.git
        ../atropos-go

go-verify:
  extends: .go-base
  stage: check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    - |
      unformatted=$(gofmt -l .)
      if [ -n "$unformatted" ]; then
        echo "These files need gofmt:"
        echo "$unformatted"
        exit 1
      fi
    - go vet ./...
    - go build ./...
    - go test ./...

go-race:
  extends: .go-base
  stage: check
  variables:
    CGO_ENABLED: "1"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    - go test -race ./...

go-integration:
  extends: .go-base
  stage: check
  services:
    - name: postgres:18-alpine
      alias: postgres
  variables:
    POSTGRES_USER: manteion
    POSTGRES_PASSWORD: manteion
    POSTGRES_DB: manteion
    MANTEION_DATABASE_URL: "postgres://manteion:manteion@postgres:5432/manteion?sslmode=disable"
    MANTEION_INTEGRATION: "1"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    - go test -count=1 -timeout 120s ./...

# ---------------------------------------------------------------------------
# OpenAPI + review
# ---------------------------------------------------------------------------

openapi-check:
  extends: .go-base
  stage: check
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
  before_script:
    - git clone --depth 1 --branch develop
        https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/microfaults/atropos-go.git
        ../atropos-go
    - apt-get update -qq && apt-get install -y -qq python3 python3-yaml
    - go install github.com/swaggo/swag/v2/cmd/swag@v2.0.0-rc5
    - export PATH=$PATH:$(go env GOPATH)/bin
  script:
    - make openapi-check

ai-review:
  stage: review
  image: python:3.12-slim
  allow_failure: true
  retry:
    max: 2
    when: script_failure
  timeout: 15m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
  artifacts:
    name: "ai-review-$CI_COMMIT_SHORT_SHA"
    paths:
      - review-output/
    expire_in: 30 days
    when: always
  before_script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
  script:
    - python3 scripts/ai-review.py
